# GENERATED from include/domains/ecommerce.yml by `python -m pipeline scaffold` — do not edit.

version: 2
models:
- name: brz_ecommerce__customers
  description: Current landing batch of customers (customers.csv), raw text. Registered customers, full
    snapshot.
  data_tests:
